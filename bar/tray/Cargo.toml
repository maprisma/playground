[package]
name = "maprisma-playground-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "KDE system tray icon for Maprisma Playground"

[dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
