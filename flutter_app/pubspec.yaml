name: maprisma_playground
description: "Maprisma Playground: try out the AI agents on your computer, a test per tab."
publish_to: 'none'
version: 0.4.2+10

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  maprisma_core_kit:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 39c68c8b9dba8d0cc1aa7b3703832ce8f67dc85e # v0.1.0
      path: packages/maprisma_core_kit
  maprisma_playground_core:
    path: ../packages/maprisma_playground_core
  maprisma_ui:
    git:
      url: https://github.com/maprisma/maprisma-kit.git
      ref: 39c68c8b9dba8d0cc1aa7b3703832ce8f67dc85e # v0.1.0
      path: packages/maprisma_ui
  file_selector: ^1.1.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
